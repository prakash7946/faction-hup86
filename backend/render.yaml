services:
  - type: web
    name: april-86-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: RECEIVER_EMAIL
        sync: false
      - key: OWNER_WHATSAPP
        sync: false
      - key: STORE_PHONE
        sync: false
      - key: CALLMEBOT_APIKEY
        sync: false
